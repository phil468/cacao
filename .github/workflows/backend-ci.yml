name: Backend CI
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml', '.github/workflows/deploy-production.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', coverage: none, tools: composer:v2}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite
      - run: php artisan migrate --force
        env: {DB_CONNECTION: sqlite, DB_DATABASE: database/database.sqlite}
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test
      - run: npm ci --no-audit --no-fund && npm run build

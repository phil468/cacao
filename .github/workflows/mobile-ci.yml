name: Mobile CI
on: {pull_request: {paths: ['mobile/**', '.github/workflows/mobile-ci.yml']}}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --browsers=ChromeHeadless
      - run: npm run build
